name: fitbodyrd_flutter
description: A new Flutter project with Serverpod.
publish_to: "none"

version: 1.1.2+8

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  cupertino_icons: ^1.0.5
  envied: ^1.3.1
  equatable: ^2.0.7
  fitbodyrd_client:
    path: ../fitbodyrd_client
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.2
  get_it: ^9.0.5
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  record_result: ^1.0.1+2
  serverpod_auth_email_flutter: 3.1.1
  serverpod_auth_google_flutter: 3.1.1
  serverpod_auth_shared_flutter: 3.1.1
  serverpod_flutter: 3.1.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.2
  vector_graphics: ^1.1.19

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.10.3
  change_app_package_name: ^1.5.0
  envied_generator: ^1.3.1
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ">=3.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  lintervention: ^0.4.0+1
  mocktail: ^1.0.4
  rename_app: ^1.6.5
  serverpod_auth_client: 3.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/app_icon.png

flutter_gen:
  output: lib/src/core/gen/
  line_length: 80

  integrations:
    image: true
    flutter_svg: true
